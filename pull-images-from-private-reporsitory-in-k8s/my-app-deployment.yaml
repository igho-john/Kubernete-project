apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app
  labels:
    app: my-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      imagePullSecrets:
      - name: ecr-key
      containers:
      - name: my-app
        image: 780432333923.dkr.ecr.ca-central-1.amazonaws.com/my-app:latest
        imagePullPolicy: Always
        ports:
          - containerPort: 3000
